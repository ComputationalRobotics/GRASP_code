[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grasp"
version = "0.1.0"
description = "GRASP: gradient-guided sampling for contact-rich physics-based motion retargeting"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.5.2",
  "scipy==1.18.0",
  "jax==0.9.2",
  "blackjax==1.6.2",
  "torch==2.9.0",
  "omegaconf==2.3.1",
  "loguru==0.7.3",
  "mujoco==3.7.0",
  "mujoco-warp==3.7.0.1",
  "warp-lang==1.12.1",
]

[project.optional-dependencies]
# data preparation (grasp.pipeline): meshes, convex decomposition, IK, MANO
pipeline = [
  "tyro==1.0.15",
  "trimesh==4.12.2",
  "coacd==1.0.13",
  "mink==1.1.0",
  "loop-rate-limiters==1.2.0",
  "imageio==2.37.4",
  "smplx==0.1.28",
  # the PyPI release (0.71) imports names removed from numpy; this commit does not
  "chumpy @ git+https://github.com/mattloper/chumpy.git@580566eafc9ac68b2614b64d6f7aaa84eebb70da",
]
# benchmarks/: plotting
benchmarks = [
  "matplotlib==3.11.1",
]
dev = ["pytest", "ruff"]

[project.scripts]
grasp-mpc = "grasp.mpc.run:main"

[tool.hatch.build.targets.wheel]
packages = ["grasp"]

[tool.hatch.metadata]
allow-direct-references = true  # chumpy is pinned to a git commit

[tool.uv.extra-build-dependencies]
chumpy = ["pip"]  # its setup.py imports pip
